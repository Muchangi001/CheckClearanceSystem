server:
  port: ${PORT:8080}
  # TLS ends at the platform proxy; trust its X-Forwarded-* so redirects stay https.
  forward-headers-strategy: native
  # The proxy does not always say it was https; relative Locations keep the scheme anyway.
  tomcat:
    use-relative-redirects: true

spring:
  application:
    name: cts
  threads:
    virtual:
      enabled: true
  # Everything lives in its own `cts` schema. Supabase's `public` is not empty
  # (Flyway refuses it) and is exposed through Supabase's REST API.
  datasource:
    hikari:
      schema: cts
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: cts
  flyway:
    locations: classpath:db/migration
    schemas: cts
    default-schema: cts
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

cts:
  image-dir: ${CTS_IMAGE_DIR:./data/images}

management:
  endpoints:
    web:
      exposure:
        include: health,info
