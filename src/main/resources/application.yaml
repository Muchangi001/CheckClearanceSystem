server:
  port: ${PORT:8080}
  # TLS ends at the platform proxy; trust its X-Forwarded-* so redirects stay https.
  forward-headers-strategy: native
  # The proxy does not always say it was https; relative Locations keep the scheme anyway.
  tomcat:
    use-relative-redirects: true

spring:
  application:
    name: cts
  threads:
    virtual:
      enabled: true
  # Everything lives in its own `cts` schema. Supabase's `public` is not empty
  # (Flyway refuses it) and is exposed through Supabase's REST API.
  datasource:
    hikari:
      schema: cts
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: cts
  flyway:
    locations: classpath:db/migration
    schemas: cts
    default-schema: cts
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 8MB

cts:
  approval-threshold-paise: 10000000     # Rs 1,00,000
  pps-threshold-paise: 5000000           # Rs 50,000
  pps-mandatory-paise: 50000000          # Rs 5,00,000
  clearing-phase: ${CTS_CLEARING_PHASE:1}
  confirmation-cutoff: "19:00"
  zone: Asia/Kolkata

management:
  endpoints:
    web:
      exposure:
        include: health,info
